apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-analysis-script
data:
  canary-analysis.js: |
    # populated from scripts/canary-analysis.js at apply time, see README
    # "Deploy steps" for the kubectl create configmap command that loads
    # the real file rather than duplicating it here.
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canarydeck-success-rate
spec:
  args:
  - name: stable-hash
  - name: canary-hash

  metrics:
    - name: statistical-canary-analysis
      # No successCondition needed, the Job provider reads the script's
      # exit code directly: 0 means promote, 1 means fail. See
      # scripts/canary-analysis.js for the actual Mann-Whitney U test.
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: analysis
                    image: node:20-slim
                    command: ["node", "/scripts/canary-analysis.js"]
                    env:
                      - name: PROMETHEUS_URL
                        value: "http://prometheus:9090"

                      - name: STABLE_HASH
                        value: "{{args.stable-hash}}"

                      - name: CANARY_HASH
                        value: "{{args.canary-hash}}"


                    volumeMounts:
                      - name: script
                        mountPath: /scripts
                volumes:
                  - name: script
                    configMap:
                      name: canary-analysis-script

apiVersion: v1
kind: Secret
metadata:
  name: canarydeck-postgres
type: Opaque
stringData:
  # Local-cluster-only demo credentials. Real deployments would source
  # this from SOPS-encrypted values (see GridState, Project 4) rather
  # than a plaintext manifest, called out here rather than pretending
  # this is production-grade secret handling.
  POSTGRES_PASSWORD: canarydeck_dev_password
  POSTGRES_USER: canarydeck
  POSTGRES_DB: canarydeck
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16.4
          envFrom:
            - secretRef: { name: canarydeck-postgres }
          ports:
            - containerPort: 5432
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
